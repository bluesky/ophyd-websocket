# Full local test stack:
#
#   caproto-ioc      -- simulated EPICS IOC serving SIM:* PVs
#   caproto-detector -- simulated areaDetector serving SIMDET1:* PVs
#   ophyd-websocket  -- FastAPI/WebSocket server, loads ophyd devices from ./startup
#   frontend         -- Vite dev server with a minimal SPA driven by finch hooks
#
#   docker compose up --build
#   open http://localhost:5173
#
# Channel Access does not survive docker's default bridge broadcast domain, so
# the clients use directed (unicast) name searches at the IOC container instead
# of relying on broadcast auto-discovery.

services:
  caproto-ioc:
    build:
      context: .
      dockerfile: caproto/Dockerfile
    container_name: caproto-ioc
    environment:
      SIM_PV_PREFIX: "SIM:"
    ports:
      # Exposed so you can run caget/caput or an ophyd session from the host.
      - "5064:5064/tcp"
      - "5064:5064/udp"
      - "5065:5065/udp"
    networks:
      - beamline

  caproto-detector:
    build:
      context: .
      dockerfile: caproto/Dockerfile
    container_name: caproto-detector
    environment:
      SIM_IOC_SCRIPT: "caproto/sim_detector_ioc.py"
      SIM_PV_PREFIX: "SIMDET1:"
    # Deliberately not published to the host: Channel Access is port-sensitive
    # and caproto-ioc already owns 5064 there. Reach it from inside the network.
    networks:
      - beamline

  caproto-tiff-detector:
    build:
      context: .
      dockerfile: caproto/Dockerfile
    container_name: caproto-tiff-detector
    environment:
      SIM_IOC_SCRIPT: "caproto/sim_tiff_detector_ioc.py"
      SIM_PV_PREFIX: "SIMTIFF1:"
      # FullFileName_RBV must name a path that *ophyd-websocket* can open, so
      # both containers mount the sample TIFFs at the same /assets path.
      SIM_TIFF_ASSETS_DIR: "/assets"
    volumes:
      - ./caproto/assets:/assets:ro
    networks:
      - beamline

  ophyd-websocket:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ophyd-websocket
    depends_on:
      - caproto-ioc
      - caproto-detector
      - caproto-tiff-detector
    command: ["uv", "run", "python", "src/ophyd_websocket/server.py", "--startup-dir", "/startup"]
    environment:
      OAS_HOST: "0.0.0.0"
      OAS_PORT: "8001"
      OAS_LOG_LEVEL: "INFO"
      OAS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      OAS_REQUIRE_QSERVER: "false"
      # Unicast CA searches straight at the IOC containers (space separated).
      EPICS_CA_ADDR_LIST: "caproto-ioc caproto-detector caproto-tiff-detector"
      EPICS_CA_AUTO_ADDR_LIST: "NO"
      EPICS_CA_MAX_ARRAY_BYTES: "10000000"
      SIM_PV_PREFIX: "SIM:"
      SIM_DETECTOR_PV_PREFIX: "SIMDET1:"
    volumes:
      # Live-editable ophyd device definitions.
      - ./startup:/startup:ro
      # Sample TIFFs, at the same path the TIFF IOC writes into FullFileName_RBV.
      - ./caproto/assets:/assets:ro
    ports:
      - "8001:8001"
    networks:
      - beamline

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: ophyd-frontend
    depends_on:
      - ophyd-websocket
    # No VITE_OPHYD_API_URL by default: the SPA falls back to
    # `http://<the host you loaded the page from>:8001/api/v1`, so it works
    # unchanged whether you browse to localhost:5173 or straight to the VM's
    # address (colima prints one via `colima status`; handy when the localhost
    # port forwarder wedges). Set it explicitly only to point the SPA at an
    # ophyd-websocket running somewhere else entirely.
    # environment:
    #   VITE_OPHYD_API_URL: "http://localhost:8001/api/v1"
    volumes:
      - ./src/frontend/src:/app/src:ro
      - ./src/frontend/index.html:/app/index.html:ro
    ports:
      - "5173:5173"
    networks:
      - beamline

networks:
  beamline:
    driver: bridge
