# Full local test stack:
#
#   caproto-ioc  -- simulated EPICS IOC serving SIM:* PVs
#   ophyd-websocket -- FastAPI/WebSocket server, loads ophyd devices from ./startup
#   frontend     -- Vite dev server with a minimal SPA driven by finch hooks
#
#   docker compose up --build
#   open http://localhost:5173
#
# Channel Access does not survive docker's default bridge broadcast domain, so
# the clients use directed (unicast) name searches at the IOC container instead
# of relying on broadcast auto-discovery.

services:
  caproto-ioc:
    build:
      context: .
      dockerfile: caproto/Dockerfile
    container_name: caproto-ioc
    environment:
      SIM_PV_PREFIX: "SIM:"
    ports:
      # Exposed so you can run caget/caput or an ophyd session from the host.
      - "5064:5064/tcp"
      - "5064:5064/udp"
      - "5065:5065/udp"
    networks:
      - beamline

  ophyd-websocket:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ophyd-websocket
    depends_on:
      - caproto-ioc
    command: ["uv", "run", "python", "src/ophyd_websocket/server.py", "--startup-dir", "/startup"]
    environment:
      OAS_HOST: "0.0.0.0"
      OAS_PORT: "8001"
      OAS_LOG_LEVEL: "INFO"
      OAS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      OAS_REQUIRE_QSERVER: "false"
      # Unicast CA searches straight at the IOC container.
      EPICS_CA_ADDR_LIST: "caproto-ioc"
      EPICS_CA_AUTO_ADDR_LIST: "NO"
      EPICS_CA_MAX_ARRAY_BYTES: "10000000"
      SIM_PV_PREFIX: "SIM:"
    volumes:
      # Live-editable ophyd device definitions.
      - ./startup:/startup:ro
    ports:
      - "8001:8001"
    networks:
      - beamline

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: ophyd-frontend
    depends_on:
      - ophyd-websocket
    environment:
      # Read by the browser, so this must be reachable from the host, not the
      # docker network. The SPA derives the ws:// URL from it.
      VITE_OPHYD_API_URL: "http://localhost:8001/api/v1"
    volumes:
      - ./src/frontend/src:/app/src:ro
      - ./src/frontend/index.html:/app/index.html:ro
    ports:
      - "5173:5173"
    networks:
      - beamline

networks:
  beamline:
    driver: bridge
